name: Rebuild after midnight

# The search-engine pages are built with the day they are built on: each city's page for today
# (/efimeries/<city>/) shows the lists of the day of the last build. The data already holds the
# coming days, so a rebuild after midnight is enough to move them to the new day. The data
# updates come later in the day (GitHub starts scheduled runs hours late).
#
# The owner creates a Deploy Hook for the production branch in the Vercel project (Settings, Git)
# and stores its URL as the repository secret VERCEL_DEPLOY_HOOK. Without it this does nothing.
on:
  schedule:
    - cron: '5 0 * * *'
      timezone: Europe/Athens
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Vercel to rebuild production
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret: nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Rebuild requested."
