name: Update data

# Fetches the official lists, validates them and commits data/ when it changed.
# See packages/ingest/src/cli/update.ts (duty lists, extended hours, pharmacies) and
# packages/ingest/src/cli/medicines.ts (medicine prices and shortages).
on:
  schedule:
    # Twice a day, Athens time. The associations publish duty lists a few days to a week ahead.
    - cron: '20 6,18 * * *'
      timezone: Europe/Athens
  workflow_dispatch:
    inputs:
      since:
        description: Fetch duty PDFs uploaded on or after this date (YYYY-MM-DD)
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each area writes its files as soon as it passes; one that fails (a site down, as ITeQ's
      # server was on 8 Oct 2026) keeps its old data. The others are still committed below, and
      # the run is marked failed at the end.
      - name: Fetch, validate and write
        id: update
        continue-on-error: true
        run: pnpm --filter @pharmacy-skg/ingest run update ${SINCE:+--since "$SINCE"}
        env:
          SINCE: ${{ inputs.since }}
      # A failure here must not hold back the duty lists: they are still committed, and the run
      # is marked failed at the end.
      - name: Medicine prices and shortages
        id: medicines
        continue-on-error: true
        run: pnpm --filter @pharmacy-skg/ingest run medicines
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "data: update $(TZ=Europe/Athens date +%Y-%m-%d)"
          git push
      - name: Report a failed area
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Some areas failed and kept their old data; see the update step. The others were committed."
          exit 1
      - name: Report a failed medicines update
        if: ${{ !cancelled() && steps.medicines.outcome == 'failure' }}
        run: |
          echo "::error::The medicines update failed; see its step. Any other data was still committed."
          exit 1
