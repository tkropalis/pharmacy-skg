name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Commits made with the workflow token (the data updates) do not start a run, and some unit tests
  # read the live data/ (they broke unseen on 1 Nov 2026). A nightly run tests master against the
  # fresh data, after "Rebuild after midnight" (00:05) and the evening data update.
  schedule:
    - cron: '30 3 * * *'
      timezone: Europe/Athens

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pharmacy-skg/web exec playwright install --with-deps chromium
      # Builds with a fixed date (PHARMACY_TODAY), then runs the browser tests against the preview.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
