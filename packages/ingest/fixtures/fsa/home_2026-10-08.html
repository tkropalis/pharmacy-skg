    <!-- Suggestions will be dynamically populated here -->
</div>
<script>
    function storeCoordinates(event) {
        console.log(event);
        const response = JSON.parse(event.detail.xhr.response);

        const latitude = response.lat;
        const longitude = response.lng;

        sessionStorage.setItem('userLatitude', JSON.stringify(latitude));
        sessionStorage.setItem('userLongitude', JSON.stringify(longitude));
        sessionStorage.setItem('userPositionCenter', JSON.stringify([latitude, longitude]));
        sessionStorage.setItem('mapCenter', JSON.stringify([latitude, longitude]));
        sessionStorage.setItem("zoomLevel", 15);
        document.getElementById('address-input').value = response.address;
    }
</script>

<script>
   
    // Get the scroll to button and the target element based on the model
    const scrollToTopBtn = document.getElementById('scroll-to-btn');
    const targetElement = document.getElementById("layout-header");

    // Create an intersection observer to watch when the target element enters and exits the viewport
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                // If the target element is in view, hide the button
                scrollToTopBtn.style.opacity = '0';
                scrollToTopBtn.style.pointerEvents = 'none';  // Optional: Prevent interaction when hidden
            } else {
                // If the target element is out of view, show the button
                scrollToTopBtn.style.opacity = '1';
                scrollToTopBtn.style.pointerEvents = 'auto';
            }
        });
    }, { threshold: 0.1 });  // Trigger the observer when at least 10% of the target is visible

    // Start observing the target element
    observer.observe(targetElement);
</script>

    function pickTextColorBasedOnBgColorAdvanced(bgColor) {

        var hexColor = colourNameToHex(bgColor);
        var color = (bgColor.charAt(0) === '#') ? bgColor.substring(1, 7) : hexColor.substring(1, 7);
        var r = parseInt(color.substring(0, 2), 16); // hexToR
        var g = parseInt(color.substring(2, 4), 16); // hexToG
        var b = parseInt(color.substring(4, 6), 16); // hexToB
        var uicolors = [r / 255, g / 255, b / 255];
        var c = uicolors.map((col) => {
            if (col <= 0.03928) {
                return col / 12.92;
            }
            return Math.pow((col + 0.055) / 1.055, 2.4);
        });
        var L = (0.2126 * c[0]) + (0.7152 * c[1]) + (0.0722 * c[2]);
        return (L > 0.179) ? 'text-dark' : 'text-white';
    }

    <script id="location">
        function findLocation(refresh) {
            if (refresh == true){
                navigator.permissions.query({ name: 'geolocation' }).then(permissionStatus => {
    console.log('Geolocation permission state:', permissionStatus.state);

        if (permissionStatus.state !== 'granted') {
        alert('Πρέπει να επιτρέψετε την πρόσβαση στην τοποθεσία σας στις ρυθμίσεις ιστοτόπου (site settings) του περιηγητή σας.');
            }})
                }
            if ("geolocation" in navigator) {
              navigator.geolocation.getCurrentPosition(
                    function (position) {
                        console.log("Entered position");
                        const latitude = position.coords.latitude;
                        const longitude = position.coords.longitude;
                        if (!sessionStorage.hasOwnProperty('userGpsCenter') || refresh == true) {
                            // Store in localStorage

                            sessionStorage.setItem('userGpsCenter', JSON.stringify([latitude, longitude]));
                            sessionStorage.setItem('userPositionCenter', JSON.stringify([latitude, longitude]));
                            sessionStorage.setItem('userLatitude', JSON.stringify(latitude));
                            sessionStorage.setItem('userLongitude', JSON.stringify(longitude));
                            sessionStorage.setItem('mapCenter', JSON.stringify([latitude, longitude]));
                            location.reload();
                        }

                    },
                    function (error) {
                            if (sessionStorage.getItem('userGpsCenter')) {
                                sessionStorage.removeItem('userGpsCenter');
                            }
                        console.error("Error getting location:", error.message);
                    }
                );
            } else {
                console.log("Geolocation is not supported by this browser.");
            }
        };
        document.addEventListener("DOMContentLoaded", findLocation(false));
    </script>
    <script>
        // Wait for the DOM to be ready
        document.addEventListener('DOMContentLoaded', function () {
            // Add a click event listener to the document
            document.addEventListener('click', function (event) {
                // Find the suggestion list element
                const suggestionList = document.getElementById('suggestion-list-items');

                // If the list exists and the click is outside the list
                if (suggestionList && !suggestionList.contains(event.target)) {
                    // Remove the list from the DOM
                    suggestionList.remove();
                }
            });
        });
